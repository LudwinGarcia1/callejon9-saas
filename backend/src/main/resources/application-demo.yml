# Perfil exclusivo para la presentacion.
#
# El token de acceso dura lo mismo que en produccion (15 minutos). Antes este
# perfil lo extendia a dos horas para que no expirara a mitad de la
# demostracion; desde que existe la renovacion con refresh token el cliente
# lo renueva solo, y un token largo solo ampliaria la ventana de uso de una
# copia robada.
#
# Uso:
#   .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=demo"
#
# Nunca activar este perfil en un entorno real.

app:
  # La demostracion corre sobre http://localhost, sin HTTPS.
  auth:
    cookie-secure: false

logging:
  level:
    com.callejon9: DEBUG

spring:
  application:
    name: callejon9

  # El runtime se conecta como callejon9_app, que NO es dueno de las tablas y
  # por lo tanto queda sujeto a las politicas RLS. Flyway se conecta como
  # callejon9_owner, que si puede crear y alterar el esquema.
  datasource:
    # Puerto 5433: esta maquina ya tenia un PostgreSQL 18 ocupando el 5432,
    # asi que el instalador del 16 tomo el siguiente libre. En CI se sobreescribe
    # con la variable de entorno DB_PORT para apuntar al contenedor de servicio.
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/callejon9
    username: callejon9_app
    password: ${DB_APP_PASSWORD:app_dev_pwd}
    hikari:
      maximum-pool-size: 10

  flyway:
    enabled: true
    user: callejon9_owner
    password: ${DB_OWNER_PASSWORD:owner_dev_pwd}
    schemas: public
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  # Zona horaria del negocio. Define que instantes delimitan "un dia" en el
  # historial de ventas. Resolverlo en UTC vaciaba la pantalla a partir de las
  # 18:00 locales, justo durante el servicio de la noche.
  timezone: America/Mexico_City

  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-min-32-bytes-long!!}
    access-token-minutes: 15
    refresh-token-days: 7

server:
  port: 8080

logging:
  level:
    org.flywaydb: INFO

spring:
  application:
    name: callejon9

  # El runtime se conecta como callejon9_app, que NO es dueno de las tablas y
  # por lo tanto queda sujeto a las politicas RLS. Flyway se conecta como
  # callejon9_owner, que si puede crear y alterar el esquema.
  datasource:
    # Puerto 5433: esta maquina ya tenia un PostgreSQL 18 ocupando el 5432,
    # asi que el instalador del 16 tomo el siguiente libre. En CI se sobreescribe
    # con la variable de entorno DB_PORT para apuntar al contenedor de servicio.
    #
    # El nombre tambien es variable porque "callejon9" puede estar ocupado por
    # otro sistema en el mismo servidor. Apuntar ahi seria peor que fallar: son
    # dos esquemas distintos del mismo dominio.
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/${DB_NAME:callejon9}
    username: callejon9_app
    password: ${DB_APP_PASSWORD:app_dev_pwd}
    hikari:
      maximum-pool-size: 10

  flyway:
    enabled: true
    user: callejon9_owner
    password: ${DB_OWNER_PASSWORD:owner_dev_pwd}
    schemas: public
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  # Zona horaria del negocio. Define que instantes delimitan "un dia" en el
  # historial de ventas. Resolverlo en UTC vaciaba la pantalla a partir de las
  # 18:00 locales, justo durante el servicio de la noche.
  timezone: America/Mexico_City

  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-min-32-bytes-long!!}
    access-token-minutes: 15
    # Vida maxima de una sesion. Renovar rota el refresh token pero no la
    # alarga: los tokens rotados heredan la expiracion del login.
    refresh-token-days: 7

  auth:
    # Atributo Secure de las cookies de sesion. Activo por defecto: fuera de
    # desarrollo la API solo debe servirse detras de HTTPS. Para trabajar
    # contra http://localhost, scripts/run-dev.ps1 lo desactiva.
    # AUTH_SECURE_COOKIE es el nombre anterior de la variable y se sigue
    # aceptando; si ambas existen, manda AUTH_COOKIE_SECURE.
    cookie-secure: ${AUTH_COOKIE_SECURE:${AUTH_SECURE_COOKIE:true}}

    # Freno contra fuerza bruta en el login (LoginAttemptLimiter). Un fallo
    # cuenta para la cuenta (restaurante + correo) y para la IP; al llegar a
    # cualquiera de los dos limites dentro de la ventana, el login responde
    # 429 hasta que el fallo mas antiguo sale de ella. El limite por IP es
    # mas alto porque varias tablets de un mismo restaurante comparten red.
    login-limit:
      max-failures-per-account: ${AUTH_LOGIN_MAX_FAILURES_ACCOUNT:5}
      max-failures-per-ip: ${AUTH_LOGIN_MAX_FAILURES_IP:20}
      window: ${AUTH_LOGIN_WINDOW:15m}

  signup:
    # Freno contra altas masivas (SignupRateLimiter). Cada alta que pasa la
    # validacion cuenta para la IP del cliente, termine creada (201) o con el
    # slug ocupado (409); al llegar al limite dentro de la ventana, el alta
    # responde 429 antes de crear nada. Un 400 por formato no cuenta.
    rate-limit:
      max-per-ip: ${SIGNUP_MAX_PER_IP:5}
      window: ${SIGNUP_WINDOW:1h}

  realtime:
    # Cada cuanto se revisan las conexiones WebSocket abiertas para cerrar las
    # de sesiones revocadas (logout, reutilizacion, baja del usuario). Es la
    # latencia maxima entre revocar y cortar; cada ciclo cuesta una consulta
    # por restaurante con conexiones abiertas.
    session-check-interval: PT30S

    # Origenes de navegador que pueden abrir el WebSocket /ws, separados por
    # coma y sin comodines. En produccion debe ser el dominio publico del
    # frontend. Los clientes que no envian Origin (no navegadores) no se
    # ven afectados.
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:3000}

server:
  port: 8080

logging:
  level:
    org.flywaydb: INFO

test:
  database:
    mode: ${TEST_DATABASE_MODE:container}

spring:
  datasource:
    url: ${TEST_DATABASE_URL:jdbc:postgresql://localhost:${DB_PORT:5433}/callejon9_test}
    username: callejon9_app
    password: ${DB_APP_PASSWORD:app_dev_pwd}

  flyway:
    user: callejon9_owner
    password: ${DB_OWNER_PASSWORD:owner_dev_pwd}
    clean-disabled: false

  jpa:
    hibernate:
      ddl-auto: validate

app:
  client-ip:
    # IP de salida simulada del frontend (rango de documentacion 192.0.2.0/24)
    # para probar la cadena navegador -> Next -> App Service de la API.
    trusted-proxies: 192.0.2.10
    # Secreto solo de pruebas que el middleware de Next enviaria con la IP
    # del navegador. No se usa en ningun entorno real.
    proxy-secret: secreto-de-prueba-del-proxy-de-next-32b

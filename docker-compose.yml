services:
  db:
    image: postgres:16-alpine
    container_name: callejon9-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/setup-db.sql:/docker-entrypoint-initdb.d/01-setup-db.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d callejon9"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: callejon9-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # La imagen arranca en prod por defecto; este entorno es de desarrollo.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: callejon9
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-app_dev_pwd}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-owner_dev_pwd}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-min-32-bytes-long!!}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    # Sistema de archivos de solo lectura: Tomcat solo escribe en /tmp.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Next fija el destino del rewrite /api/v1 al compilar. Cambiarlo
        # requiere reconstruir la imagen: no se lee al arrancar.
        BACKEND_ORIGIN: http://backend:8080
    container_name: callejon9-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    # Sistema de archivos de solo lectura: Next solo escribe su cache.
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=10001,gid=10001,mode=0700
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  pgdata:

name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'docs/**', 'chore/**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Create roles and test database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE callejon9_owner LOGIN PASSWORD 'owner_dev_pwd';"
          psql -h localhost -U postgres -c "CREATE ROLE callejon9_app   LOGIN PASSWORD 'app_dev_pwd';"
          psql -h localhost -U postgres -c "CREATE DATABASE callejon9_test OWNER callejon9_owner;"
          psql -h localhost -U postgres -d callejon9_test -c "GRANT USAGE ON SCHEMA public TO callejon9_app;"

      - name: Run tests
        working-directory: backend
        env:
          DB_PORT: 5432
          DB_APP_PASSWORD: app_dev_pwd
          DB_OWNER_PASSWORD: owner_dev_pwd
          JWT_SECRET: ci-only-secret-at-least-32-bytes-long!!
        run: ./mvnw --batch-mode verify

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # La version de pnpm sale del campo packageManager de frontend/package.json.
      # package_json_file es obligatorio aqui: la accion lo busca en la raiz del
      # repositorio por defecto, y en la raiz no hay package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # --frozen-lockfile falla si package.json y pnpm-lock.yaml divergen, que es
      # justo lo que debe bloquear un PR.
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Typecheck
        working-directory: frontend
        run: pnpm exec tsc --noEmit

      - name: Production build
        working-directory: frontend
        run: pnpm build

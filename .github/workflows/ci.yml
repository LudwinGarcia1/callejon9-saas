name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        working-directory: backend
        env:
          JWT_SECRET: ci-only-secret-at-least-32-bytes-long!!
        run: ./mvnw --batch-mode verify
